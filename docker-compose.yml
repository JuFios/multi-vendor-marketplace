# Full stack: `docker compose up --build` (works without a .env file).
# UI: http://localhost:8080   API through it: http://localhost:8080/api/health
# Only the web (nginx) port is open to the network. The api is reachable inside the compose network
# alone; the database, Redis, Meilisearch and the worker's metrics listen on localhost only.

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WEB_URL: ${WEB_URL:-http://localhost:8080}
  # One reverse proxy (nginx) in front of the api, and the api port is not published, so nginx
  # is the only peer that can set X-Forwarded-For.
  TRUST_PROXY: '1'
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-access-secret-change-me-0123456789}
  # The compose stack serves the whole site over plain http.
  COOKIE_SECURE: 'false'
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
  WORKER_METRICS_PORT: '9100'
  DATABASE_URL: postgresql://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/${POSTGRES_DB:-marketplace}
  REDIS_URL: redis://redis:6379/0
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
  MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-dev_}
  SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-1500}
  SEARCH_REDRIVE_INTERVAL_MS: ${SEARCH_REDRIVE_INTERVAL_MS:-30000}
  PRODUCT_PREMODERATION: ${PRODUCT_PREMODERATION:-false}
  PLATFORM_COMMISSION_BPS: ${PLATFORM_COMMISSION_BPS:-1000}
  ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Europe/Kyiv}
  MOCK_PAYMENT_FAILURE_RATE: ${MOCK_PAYMENT_FAILURE_RATE:-0}
  AUCTION_WINNER_CHECKOUT_WINDOW_MIN: ${AUCTION_WINNER_CHECKOUT_WINDOW_MIN:-30}
  THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-100}
  THROTTLE_DEFAULT_TTL: ${THROTTLE_DEFAULT_TTL:-60}
  THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-5}
  THROTTLE_LOGIN_TTL: ${THROTTLE_LOGIN_TTL:-60}
  THROTTLE_REGISTER_LIMIT: ${THROTTLE_REGISTER_LIMIT:-10}
  THROTTLE_REGISTER_TTL: ${THROTTLE_REGISTER_TTL:-60}
  THROTTLE_REFRESH_LIMIT: ${THROTTLE_REFRESH_LIMIT:-30}
  THROTTLE_REFRESH_TTL: ${THROTTLE_REFRESH_TTL:-60}
  THROTTLE_BID_LIMIT: ${THROTTLE_BID_LIMIT:-10}
  THROTTLE_BID_TTL: ${THROTTLE_BID_TTL:-10}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${MEILI_PORT:-7700}:7700'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      <<: *app-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-change-me-demo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      <<: *app-environment
    # No published port on purpose: the web service proxies /api and /socket.io to it, and
    # /metrics stays inside the network. `docker-compose.load.yml` opens it on localhost.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-environment
    ports:
      - '127.0.0.1:${WORKER_METRICS_PORT:-9100}:9100'
    # The image probes the HTTP api, which the worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meili_data:
